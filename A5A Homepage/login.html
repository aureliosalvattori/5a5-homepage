<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login — A5A</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: #0a0118;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .login-container {
      background: #1a1030;
      padding: 40px;
      border-radius: 20px;
      width: 350px;
      box-shadow: 0 0 15px rgba(255, 115, 0, 0.3);
    }

    .login-container h2 {
      text-align: center;
      margin-bottom: 20px;
      color: var(--accent-orange);
    }

    .login-container label {
      font-weight: 600;
    }

    .login-container input {
      width: 100%;
      padding: 12px;
      margin: 10px 0 20px;
      border-radius: 8px;
      border: none;
      outline: none;
      background: #2a1848;
      color: #fff;
    }

    .login-container button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: var(--accent-orange);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }

    .login-container button:hover {
      background: #ff8533;
      transform: scale(1.05);
    }

    .alt {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
    }

    .alt a {
      color: var(--accent-orange);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Entrar</h2>

    <form>
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Seu email" required>

      <label for="senha">Senha</label>
      <input type="password" id="senha" placeholder="Sua senha" required>

      <button type="submit">Entrar</button>
    </form>

    <div class="alt">
      Não tem conta? <a href="#">Cadastre-se</a>
    </div>
  </div>
</body>
</html>
